<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body style="width: 100%; height: 100%; border: 0; margin: 0; padding: 0;">
    <div style="width: 100%; height: 100%; font-family: Lucida Bright;">
        <table style="width: 95%; height: 100%; border-style: solid; border-width: 2px; border-radius:5px; margin-left: auto;
  margin-right: auto; text-align: center;">
            <thead style="background-color: orange; color: white; ">
                <tr>
                    <th>
                        <h2>Input Component</h2>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr style="text-align: left;">
                    <td>
                        <b>
                            Please capture the text
                        </b>
                    </td>
                </tr>
                <tr style="text-align: left;">
                    <td>
                        <input type="text" id="txtInputText" style="width: 98%;" onkeydown="EnterInputText()"/>
                    </td>
                </tr>                
            </tbody>
            <tfoot>
                <tr>
                    <td>
                        <button id="btnAccept" style="font-family: Lucida Bright; font-weight: bold;" onclick="return CloseWindow();">Accept</button>
                        <br />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="lblMessage"></label>
                    </td>
                </tr>
            </tfoot>
        </table>
        <button id="btnClearMessage" onclick="return ClearMessage();" style="display: none;"></button>
    </div>
</body>
</html>
<script type="text/javascript">

    function EnterInputText() {
        if (event.key === 'Enter') {
            CloseWindow();
        }
    }

    function CloseWindow() {
        var txtInputText = document.getElementById("txtInputText");
        var lblMessage = document.getElementById("lblMessage");

        if (lblMessage != null) {
            lblMessage.innerHTML = "Closing...";
        }

        //window.close();
        window.electronAPI.sendDialogResult(txtInputText.value);

        return false;
    }

    function ClearMessage() {
        var lblMessage = document.getElementById("lblMessage");

        if (lblMessage != null) {
            lblMessage.innerHTML = "";
        }

        return false;
    }

</script>
