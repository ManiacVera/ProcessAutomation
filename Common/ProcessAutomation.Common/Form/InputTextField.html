<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<link href="../Scripts/AngularJS/angular/jquery-ui/jquery-ui.css" rel="stylesheet">
	<link href="../Scripts/AngularJS/css/tribute.css" rel="stylesheet">
	<link href="../Scripts/AngularJS/css/bootstrap.min.css" rel="stylesheet">
	<link href="../Scripts/AngularJS/css/bootstrap-icons.min.css" rel="stylesheet">
	<link href="../Scripts/AngularJS/css/scrollbar.css" rel="stylesheet">
	<link href="../Scripts/AngularJS/css/spinner.css" rel="stylesheet">
	<link href="../Scripts/AngularJS/css/main.css" rel="stylesheet">

	<meta charset="utf 8">
	<title>AppAutomation</title>
</head>
<body ng-app="app" id="appId">
	<div ng-controller="AppController" id="controllerId">
		<form name="form">
			<div class="row table-dark" ng-show="isLoading" style="height:600px; vertical-align: middle;">
				<div class="col-md-12">
					<div class="spinner">
						<div class="double-bounce1"></div>
						<div class="double-bounce2"></div>
					</div>
				</div>
			</div>
			<div class="row" ng-show="!isLoading">
				<div class="col-md-12">
					<table class="table table-dark" style="border-width: 1.5px;">
						<thead style="text-align:center;">
							<tr style="background-color: orange;">
								<th colspan="2">
									<h1 class="labelText"> {{componentName}} </h1>
								</th>
							</tr>
							<tr>
								<th style="width: 120px; text-align:left;">
									<label class="labelText">Campo:</label>
								</th>
								<th style="text-align: left">
									<h4 class="labelText"> {{fieldName}} </h4>
								</th>
							</tr>
							<tr>
								<th style="width: 120px; text-align:left;">
									<label class="labelText">Formato:</label>
								</th>
								<th style="text-align: left">
									<h4 class="labelText">{{getSetSelected}}</h4>
									<button id="btnDummy" ng-click="onChangeGetSet()" style="display: none;"></button>
									<button id="btnRefreshTranslation" ng-click="changeLanguage('es')" style="display: none;"></button>
								</th>
							</tr>
						</thead>
						<tbody ng-if="getSetSelected != null && getSetSelected != ''">
							<tr>
								<td colspan="2">
									<div class="rounded shadow-5 inputField" ng-style="commonStyle">
										<textarea tribute class="form-control" ng-model="$data.value" rows="10"></textarea>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</form>
	</div>
	
	<script src="../Scripts/AngularJS/angular/jquery.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/jquery-ui/jquery-ui.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/js/bootstrap.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/angular.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/angularjs-contenteditable.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/angular-translate.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/angular-translate-loader-partial.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/generic-scripts.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/tribute.min.js" type="text/javascript"></script>

	<!-- GLOBAL VARIABLE FOR APPLICATION -->
	<script>
		var app = angular.module('app', ['pascalprecht.translate']);
	</script>

	<script src="../Scripts/AngularJS/angular/tribute.data.js"></script>
	<script src="../Scripts/AngularJS/angular/tribute.service.js"></script>
	<script src="../Scripts/AngularJS/angular/tribute.directive.js"></script>

	<script>
		var translationValue = null;
		var translationReady = false;
		var providerTranslations = null;

		app.config(function ($translateProvider, $httpProvider) {
			$httpProvider.defaults.useXDomain = true;
			delete $httpProvider.defaults.headers.common['X-Requested-With'];

			setTimeout(function () {

				$translateProvider.translations('es', {
					TRANSLATION: translationValue
				});
				$translateProvider.useLoaderCache(false);
				$translateProvider.preferredLanguage('es');
				document.getElementById('btnRefreshTranslation').click();

				translationReady = true;
			}, 1000);

		});

		app.controller("AppController", function ($scope, $translate, $translatePartialLoader, tributeService) {
			$scope.tableStyle = { "overflow-x": "auto" };
			$scope.commonStyle = { "overflow-x": "auto" };
			$scope.isLoading = true;
			$scope.fieldName = "[@fieldName]";
			$scope.componentName = "[@componentName]";
			$scope.getSetSelected = '[@action]';
			$scope.getSetOption = ["", "GET", "SET"];
			$scope.checkboxListSettings = {
				scrollableHeight: '250px',
				scrollable: true,
				enableSearch: false
			};

			$scope.enabledOptions = false;
			$scope.$data = {};

			$scope.refreshTranslation = function () {
				$translate.refresh();
			};

			$scope.changeLanguage = function (languageKey) {
				$translate.use(languageKey);
				$scope.isLoading = false;
			};

			$scope.setFieldTranslation = function (customTranslate, defaultTranslate) {
				var result = null;

				if ($translate.instant("TRANSLATION." + customTranslate) == "TRANSLATION." + customTranslate) {
					result = defaultTranslate;
				}
				else {
					result = $translate.instant("TRANSLATION." + customTranslate);
				}

				return result;
			};

			$scope.setAngularFields = function (fieldName, componentName, getSetSelected, fieldArray, variableArray) {
				$scope.fieldName = fieldName;
				$scope.componentName = componentName;
				$scope.getSetSelected = getSetSelected;

				if (variableArray != null && variableArray.length > 0) {
					tributeService.setVariables(variableArray.map(function (item) {
						return { 'key': item, 'value': item};
					}));
				}

				tributeService.setFunctions(functionsList);

				document.getElementById('btnDummy').click();

				if (!Array.isArray(fieldArray)) {
					$scope.$data.value = fieldArray;
				}

				document.getElementById('btnDummy').click();
			};

			$scope.setTableStyle = function (tableStyle) {
				$scope.tableStyle = tableStyle;
				$scope.$apply();
			}

			$scope.setCommonStyle = function (commonStyle) {
				$scope.commonStyle = commonStyle;
				$scope.$apply();				
			}

			$scope.setEnabledOptions = function (enabledOptions) {
				$scope.enabledOptions = enabledOptions;

				document.getElementById('btnDummy').click();
			};
			
			$scope.onChangeGetSet = function () {
			};

			$scope.onRowInit = function (value) {

			};

			$scope.onSuccess = function () {
				var result = {
								"isTextField": true,
								"value": $scope.$data.value
							 };
				return result;
			};
		});

		function getAngularScope() {
			return angular.element(document.getElementById('controllerId')).scope();
		}

        function setFieldsEncode(fieldName, componentName, getSetSelected, fieldArray, variableArray) {
            setFields(fieldName, componentName, getSetSelected, atob(fieldArray), atob(variableArray));
        }

		function setFields(fieldName, componentName, getSetSelected, fieldArray, variableArray) {
			getAngularScope().setAngularFields(fieldName, componentName, getSetSelected, fieldArray,
				variableArray ? JSON.parse(variableArray) : []);
		}

		function onSuccessData() {
			return getAngularScope().onSuccess();
		}

        function setTranslationEncode(value) {
            setTranslation(atob(value));
        }

		function setTranslation(value) {
			translationValue = JSON.parse(value);
		}

		function setStyle() {
			getAngularScope().setTableStyle({
				"width": "100%"
			});

			getAngularScope().setCommonStyle({
				"width": (window.innerWidth - 25).toString() + "px",
				"overflow-x": "auto"
			});

		}

		window.onresize = function () {
			setStyle();
		}

	</script>
</body>
</html>
