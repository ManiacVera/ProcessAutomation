<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<link href="../Scripts/AngularJS/angular/jquery-ui/jquery-ui.css" rel="stylesheet">
	<link href="../Scripts/AngularJS/css/bootstrap.min.css" rel="stylesheet">
	<link href="../Scripts/AngularJS/css/spinner.css" rel="stylesheet">

	<style>
		html {
		}

		label {
			font-size: 16px;
		}

		table {
			font-size: 16px;
		}

		table, th, td {
			border: 1px solid black;
		}

        .labelText {
            text-shadow: 2px 2px 4px #000000;
        }

        .labelField {
            text-shadow: 2px 2px 4px #000000;
			font-weight: bold;
        }

        .inputField {
            background-color: orange;
            padding-top: 6px;
            padding-bottom: 1px;
            padding-left: 1px;
            padding-right: 1px;
        }

        .iconMove {
            background-color: orange;
            color: white;
            font-weight: bold;
            height: 32px;
            width: 32px;
            text-align: center;
        }

        .iconAdd {
            background-color: lime;
            color: white;
            font-weight: bold;
            height: 32px;
            width: 32px;
            text-align: center;
        }

        .iconDelete {
            background-color: red;
            color: white;
            font-weight: bold;
            height: 32px;
            width: 32px;
            text-align: center;
        }

        .fieldOptions {
            width: 100%;
            text-align: right;
            border: 0;
            padding: 0;
            margin: 0;
        }
	</style>
	<meta charset="utf 8">
	<title>AppAutomation</title>
</head>
<body ng-app="app" id="appId">
	<div ng-controller="AppController" id="controllerId">
		<form name="form">
			<div class="row table-dark" ng-show="isLoading" style="height:600px; vertical-align: middle;">
				<div class="col-md-12">
					<div class="spinner">
						<div class="double-bounce1"></div>
						<div class="double-bounce2"></div>
					</div>
				</div>
			</div>
			<div class="row" ng-show="!isLoading">
				<div class="col-md-12">
					<table class="table table-dark" style="border-width: 1.5px;">
						<thead style="text-align:center;">
							<tr style="background-color: orange;">
								<th colspan="2">
									<h1 class="labelText"> {{componentName}} </h1>
								</th>
							</tr>
							<tr>
								<th style="width: 120px; text-align:left;">
									<label class="labelText">Campo:</label>
								</th>
								<th style="text-align: left">
									<h4 class="labelText"> {{fieldName}} </h4>
								</th>
							</tr>
							<tr style="display: none;">
								<th style="width: 120px; text-align:left;">
								</th>
								<th style="text-align: left">
									<button id="btnDummy" ng-click="onChangeGetSet()" style="display: none;"></button>
									<button id="btnRefreshTranslation" ng-click="changeLanguage('es')" style="display: none;"></button>
								</th>
							</tr>
						</thead>
						<tbody ng-if="tokenForm != null && tokenForm != ''">						
							<tr>
								<td colspan="2">
									<div class="rounded shadow-5 inputField">
										<br />
										<div>
											<table class="table table-dark">
												<thead style="text-align:center;">
													<tr>
														<th>
															<h4 class="labelText"> Active </h4>
															<!-- {{setFieldTranslation(gridHeaderValue.Field, gridHeaderValue.Label)}} -->
														</th>
														<th>
															<h4 class="labelText"> Parameter </h4>
															<!-- {{setFieldTranslation(gridHeaderValue.Field, gridHeaderValue.Label)}} -->
														</th>
														<th>
															<h4 class="labelText"> Value </h4>
															<!-- {{setFieldTranslation(gridHeaderValue.Field, gridHeaderValue.Label)}} -->
														</th>
													</tr>
												</thead>
												<tbody>
													<tr ng-repeat="data in fieldList">
														<td>
															<input class="form-control" type="checkbox" ng-model="data.Active" />
														</td>
														<td>
															<h4 class="labelText"> {{data.ResultParameter}} </h4>
														</td>
														<td>
															<div ng-switch="data.ControlType">
																<input class="form-control" type="text" datepicker="" format="{{(data.Format ? data.Format : 'dd/mm/yy')}}" ng-model="data.Value" ng-switch-when="DATE" ng-disabled="!data.Active" />
																<input class="form-control" type="text" ng-model="data.Value" ng-switch-when="TEXTBOX" ng-disabled="!data.Active" />
																<textarea class="form-control" ng-model="data.Value" ng-switch-when="TEXTAREA" rows="3" ng-disabled="!data.Active"></textarea>
																<input class="form-control" type="checkbox" ng-model="data.Value" ng-switch-when="CHECKBOX" ng-disabled="!data.Active" />
																<select class="form-control" ng-model="data.Value" ng-options="x for x in onSetOptionValue(data.OptionValue, data.OptionDisplay, data.OptionKey, data.OptionSort)" ng-switch-when="COMBOBOX" ng-disabled="!data.Active"></select>
															</div>
														</td>
													</tr>
												</tbody>
											</table>
										</div>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="col-md-12">
					<!--<button id="btnSuccessData" ng-click="onSuccess()" class="form-control col-md-4" style="background-color: orange;" >Accept</button>-->
				</div>
			</div>
		</form>
	</div>

	<script src="../Scripts/AngularJS/angular/jquery.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/jquery-ui/jquery-ui.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/js/bootstrap.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/angular.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/angularjs-dropdown-multiselect.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/angular-translate.min.js" type="text/javascript"></script>
	<script src="../Scripts/AngularJS/angular/angular-translate-loader-partial.min.js" type="text/javascript"></script>
	<script>
		var app = angular.module('app', ['angularjs-dropdown-multiselect', 'pascalprecht.translate']);
		var translationValue = null;
		var translationReady = false;
		var providerTranslations = null;

		app.config(function ($translateProvider, $httpProvider) {
			$httpProvider.defaults.useXDomain = true;
			delete $httpProvider.defaults.headers.common['X-Requested-With'];

			//$translateProvider.useLoader('$translatePartialLoader', {
			//	urlTemplate: 'Resources/{part}/{lang}.json'
			//});

			setTimeout(function () {

				$translateProvider.translations('es', {
					TRANSLATION: translationValue
				});
                $translateProvider.useLoaderCache(false);
				$translateProvider.preferredLanguage('es');
                document.getElementById('btnRefreshTranslation').click();

                translationReady = true;
			}, 1000);

		});

		app.controller("AppController", function ($scope, $translate, $translatePartialLoader) {
			//$translatePartialLoader.addPart('i18n');
			//$translate.refresh();

			$scope.isLoading = true;
			$scope.fieldName = "[@fieldName]";
			$scope.componentName = "[@componentName]";
			$scope.tokenForm = '[@action]';
			$scope.fieldArray = [];
			$scope.fieldList = [];
				//{
				//	"ResultParameter": "FIRST_ROW_AS_COLUMN",
				//	"Value": false,
				//	"Active": false,
				//	"ControlType": "CHECKBOX"
				//},
				//{
				//	"ResultParameter": "SEPARATOR",
				//	"Value": ",",
				//	"Active": false,
				//	"ControlType": "TEXTBOX"
				//}];

			$scope.refreshTranslation = function () {
                $translate.refresh();
			};

			$scope.changeLanguage = function (languageKey) {
				$translate.use(languageKey);
                $scope.isLoading = false;
			};

            $scope.setFieldTranslation = function (customTranslate, defaultTranslate) {
				var result = null;

				if ($translate.instant("TRANSLATION." + customTranslate) == "TRANSLATION." + customTranslate) {
					result = defaultTranslate;
				}
				else {
                    result = $translate.instant("TRANSLATION." + customTranslate);
				}

                return result;
            };

			$scope.setAngularFields = function (fieldName, componentName, tokenForm, fieldArray) {                
				$scope.fieldName = fieldName;
				$scope.componentName = componentName;
				$scope.tokenForm = tokenForm;
				$scope.fieldArray = angular.copy(fieldArray);
				//$scope.selectAction($scope.tokenForm);

				document.getElementById('btnDummy').click();

				$scope.loadResult();

				document.getElementById('btnDummy').click();
			};

			$scope.setEnabledOptions = function (enabledOptions) {
				$scope.enabledOptions = enabledOptions;

				document.getElementById('btnDummy').click();
			};

			$scope.onValueRequired = function (required, visibleEval) {
				var result = false;

				if (required) {
					result = required;
				}

                if (visibleEval) {
                    var visible = $scope.$eval(visibleEval);
					if (!visible) {
						result = false;
					}
				}

                return result;
            };

			$scope.onChangeGetSet = function () {
				$scope.tokenForm = "OkToken";
				//$scope.selectAction($scope.tokenForm);
			};

			$scope.onSetOptionValue = function (optionValue, optionDisplay, optionKey, sort) {
				var result = null;

				if (optionDisplay && optionKey) {
					result = [];
					optionValue = $scope.$eval(optionValue);

					for (var item in optionValue) {
						result.push(optionValue[item][optionDisplay]);

						//result.push({
						//    "key": optionValue[item][optionKey],
						//    "value": optionValue[item][optionDisplay]
						//});
					}

					if (sort && sort == true) {
						result.sort();
					}

					// LUIS VERA: ESTA FUNCION result.sort NO ES RECONOCIDA POR EL EDGE Y NO GENERABA EL FORMULARIO, PUEDE SER EL LAMBDA EXPRESSION
					//if (sort && sort == true) {
					//    result = result.sort((a, b) => {
					//        if (a.value < b.value) {
					//            return -1;
					//        }
					//    });
					//}
				}
				else {
					if (optionValue) {
						result = [];
						for (var item in optionValue) {
							result.push(optionValue[item]);
							//result.push({
							//    "key": optionValue[item],
							//    "value": optionValue[item]
							//});
						}

						if (sort && sort == true) {
							result.sort();
						}
					}
				}

				return result;
			};

			$scope.loadResult = function () {
				$scope.fieldList = angular.copy($scope.fieldArray);
				//for (var itemIndex in $scope.fieldArray) {
					//var item = $scope.fieldArray[itemIndex];
					//$scope.fieldList.push(
					//{
						//"ResultParameter": item.ResultParameter,
						//"Value": item.Value,
						//"Active": false,
						//"ControlType": "CHECKBOX"
					//});
				//}
			};

			$scope.onSuccess = function () {
				
				var result = {};

				try {
					if ($scope.form.$valid) {
						var item = null;
						for (var itemIndex in $scope.fieldList) {
							var item = $scope.fieldList[itemIndex];
							if (item.Active && item.Value.toString().trim() != "") {
								result[item.ResultParameter] = angular.copy(item.Value);
							}
						}
					}
                    else {
                        result["hasErrorInForm"] = true;
                    }
				}
				catch (exception) {
                    result["hasErrorInForm"] = true;
				}
				
				if (Object.keys(result).length === 0){
					result = null;
				}
				
				//alert(JSON.stringify(result));
				return angular.toJson(result, true);
			};
		});

		function getAngularScope() {
			return angular.element(document.getElementById('controllerId')).scope();
		}

        function setFieldsEncode(fieldName, componentName, tokenForm, fieldArray) {
			setFields(fieldName, componentName, tokenForm, atob(fieldArray));
        }

		function setFields(fieldName, componentName, tokenForm, fieldArray) {
			getAngularScope().setAngularFields(fieldName, componentName, tokenForm, JSON.parse(fieldArray));
		}

		function setEnabledOptions(enabledOptions) {
			getAngularScope().setEnabledOptions(enabledOptions);
		}

		function onSuccessData() {
			return getAngularScope().onSuccess();
		}

        function setTranslationEncode(value) {
            setTranslation(atob(value));
        }
        
		function setTranslation(value) {
			translationValue = JSON.parse(value);
        }

	</script>
	<script src="../Scripts/AngularJS/angular/datepicker.js" type="text/javascript"></script>

</body>
</html>
