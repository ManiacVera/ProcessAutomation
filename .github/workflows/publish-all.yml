
name: Publish All Applications

on:
  workflow_dispatch:
    inputs:
      os:
        description: Select the platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux

jobs:

  # ==========================================
  # 1. PREPARE MATRIX
  # ==========================================

  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate platform matrix
        id: set-matrix
        env:
          SELECTED_OS: ${{ inputs.os }}
        shell: bash
        run: |
          matrix=$(jq -cn --arg selected "$SELECTED_OS" '
          [
            {
              os:"macos", runner:"macos-latest",
              target:"PublishProcessAutomationApp",
              app:"ProcessAutomationElectron", rid:"osx-x64"
            },
            {
              os:"macos", runner:"macos-latest",
              target:"PublishProcessAutomationApp",
              app:"ProcessAutomationElectron", rid:"osx-arm64"
            },
            {
              os:"macos", runner:"macos-latest",
              target:"PublishProcessViewerApp",
              app:"ProcessViewerElectron", rid:"osx-x64"
            },
            {
              os:"macos", runner:"macos-latest",
              target:"PublishProcessViewerApp",
              app:"ProcessViewerElectron", rid:"osx-arm64"
            },

            {
              os:"windows", runner:"windows-latest",
              target:"PublishProcessAutomationApp",
              app:"ProcessAutomationElectron", rid:"win-x64"
            },
            {
              os:"windows", runner:"windows-latest",
              target:"PublishProcessAutomationApp",
              app:"ProcessAutomationElectron", rid:"win-arm64"
            },
            {
              os:"windows", runner:"windows-latest",
              target:"PublishProcessAutomationApp",
              app:"ProcessAutomationElectron", rid:"win-x64-unpacked"
            },
            {
              os:"windows", runner:"windows-latest",
              target:"PublishProcessAutomationApp",
              app:"ProcessAutomationElectron", rid:"win-arm64-unpacked"
            },
            {
              os:"windows", runner:"windows-latest",
              target:"PublishProcessViewerApp",
              app:"ProcessViewerElectron", rid:"win-x64"
            },
            {
              os:"windows", runner:"windows-latest",
              target:"PublishProcessViewerApp",
              app:"ProcessViewerElectron", rid:"win-arm64"
            },

            {
              os:"linux", runner:"ubuntu-latest",
              target:"PublishProcessAutomationApp",
              app:"ProcessAutomationElectron", rid:"linux-x64"
            },
            {
              os:"linux", runner:"ubuntu-latest",
              target:"PublishProcessAutomationApp",
              app:"ProcessAutomationElectron", rid:"linux-arm64"
            },
            {
              os:"linux", runner:"ubuntu-latest",
              target:"PublishProcessViewerApp",
              app:"ProcessViewerElectron", rid:"linux-x64"
            },
            {
              os:"linux", runner:"ubuntu-latest",
              target:"PublishProcessViewerApp",
              app:"ProcessViewerElectron", rid:"linux-arm64"
            }
          ]
          | if $selected == "all" then .
            else map(select(.os == $selected))
            end
          ')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected platform: $SELECTED_OS"
          echo "$matrix"

  # ==========================================
  # 2. PUBLISH APPLICATIONS
  # ==========================================

  publish:
    name: Publish (${{ matrix.os }} - ${{ matrix.app }} - ${{ matrix.rid }})

    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # LINUX DEPENDENCIES
      # ==========================================

      - name: Setup Linux Dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            zlib1g-dev \
            libfuse2 \
            curl \
            tar \
            wget \
            libssl-dev \
            pkg-config \
            zig

      # ==========================================
      # TOOLCHAINS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.5.0'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rid == 'osx-arm64' && 'aarch64-apple-darwin' || matrix.rid == 'osx-x64' && 'x86_64-apple-darwin' || matrix.rid == 'win-arm64' && 'aarch64-pc-windows-msvc' || matrix.rid == 'win-x64' && 'x86_64-pc-windows-msvc' || matrix.rid == 'linux-arm64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}

      - name: Install cargo-zigbuild
        if: matrix.os == 'linux'
        run: cargo install --locked cargo-zigbuild

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ==========================================
      # RESTORE
      # ==========================================

      - name: Restore applications
        shell: pwsh
        run: |
          $actualRid = "${{ matrix.rid }}".Replace("-unpacked", "")

          Write-Host "Restoring for $actualRid"

          dotnet msbuild Build.proj `
            "/t:RestoreApplications" `
            "/p:UserRuntimeIdentifier=$actualRid"

          if ($LASTEXITCODE -ne 0) {
            throw "Restore failed for $actualRid"
          }

      # ==========================================
      # BUILD
      # ==========================================

      - name: Publish application
        shell: pwsh
        run: |
          $actualRid = "${{ matrix.rid }}".Replace("-unpacked", "")

          Write-Host "Publishing ${{ matrix.app }} for $actualRid"

          dotnet msbuild Build.proj `
            "/t:${{ matrix.target }}" `
            "/p:UserRuntimeIdentifier=$actualRid"

          if ($LASTEXITCODE -ne 0) {
            throw "Publish failed for ${{ matrix.target }} - $actualRid"
          }

      # ==========================================
      # PACKAGE
      # ==========================================

      - name: Process outputs
        shell: pwsh
        run: |
          $sourceDir = "Build/App/${{ matrix.app }}"
          $destBase = "Publicaciones/${{ matrix.os }}/${{ matrix.app }}"

          if (!(Test-Path -LiteralPath $sourceDir)) {
            throw "Output directory not found: $sourceDir"
          }

          New-Item -ItemType Directory -Force -Path $destBase | Out-Null

          $rid = "${{ matrix.rid }}"

          if ($rid.EndsWith("-unpacked")) {
            $zipName = "${{ matrix.app }}-$rid.zip"

            Compress-Archive `
              -Path "$sourceDir\*" `
              -DestinationPath "$destBase/$zipName" `
              -Force
          }
          else {
            Get-ChildItem -LiteralPath $sourceDir -Force |
              Copy-Item -Destination $destBase -Recurse -Force
          }

          $files = Get-ChildItem -LiteralPath $destBase -File -Recurse

          if (!$files) {
            throw "No publication files generated in $destBase"
          }

      # ==========================================
      # UPLOAD INDIVIDUAL ARTIFACT
      # ==========================================

      - name: Upload individual artifact
        uses: actions/upload-artifact@v4
        with:
          name: pub-${{ matrix.os }}-${{ matrix.app }}-${{ matrix.rid }}
          path: Publicaciones/
          if-no-files-found: error
          retention-days: 30

  # ==========================================
  # 3. COLLECT ALL PUBLICATIONS
  # ==========================================

  collect:
    name: Collect all publications

    needs: publish

    runs-on: ubuntu-latest

    steps:

      - name: Download all publications
        uses: actions/download-artifact@v4
        with:
          pattern: pub-*
          path: Final/
          merge-multiple: true

      - name: Verify final package
        shell: bash
        run: |
          echo "Generated publications:"
          find Final -type f

          if [ -z "$(find Final -type f -print -quit)" ]; then
            echo "No publication files found"
            exit 1
          fi

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: All-Publications-${{ github.run_number }}
          path: Final/
          retention-days: 30
          if-no-files-found: error
